[project]
name = "mlzoomcamp-2026"
version = "0.1.0"
description = "Notes and exercises from DataTalksClub's Machine Learning Zoomcamp (2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipython>=9",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7",
    "jupyterlab>=4",
    "nbconvert>=7",
]
